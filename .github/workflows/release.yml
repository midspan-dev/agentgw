name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - run: ./scripts/go test ./...
      # Release binaries use the Go version in go.mod, like the tests' golang:1.27 image.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: go.mod }
      # Needs repo secret HOMEBREW_TAP_TOKEN (write access to midspan-dev/homebrew-tap).
      # Tags with a "-" (v1.0.0-rc.1) become GitHub pre-releases; goreleaser
      # skips the brew formula for them (skip_upload: auto).
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Image tags: X.Y.Z (no "v", same as `brew` prints); :latest only for non-pre-releases.
      - id: img
        run: |
          v="${GITHUB_REF_NAME#v}"
          tags="ghcr.io/midspan-dev/agentgw:$v"
          case "$v" in *-*) ;; *) tags="$tags,ghcr.io/midspan-dev/agentgw:latest" ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.img.outputs.version }}
          tags: ${{ steps.img.outputs.tags }}
