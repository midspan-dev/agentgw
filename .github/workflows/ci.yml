name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      # Same toolchain image as local: the root compose.yaml `go` service.
      - run: ./scripts/go build ./...
      - run: ./scripts/go test ./...
      - run: docker build -t agentgw:ci .
      - run: docker run --rm agentgw:ci version

